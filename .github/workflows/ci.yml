# CI — lint, typecheck y tests para calc-core, backend y frontend.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calc-core:
    name: calc-core (TypeScript)
    # Pin explícito: ubuntu-latest migra a Ubuntu 26 el 19-oct-2026.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: calc-core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: calc-core/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  backend:
    name: backend (Python)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Tests (paridad con calc-core + endpoints)
        env:
          DATABASE_URL: ''
          API_RATE_LIMIT_PER_MINUTE: '10000'
        run: pytest

  frontend:
    name: frontend (Next.js)
    runs-on: ubuntu-24.04
    needs: calc-core   # necesita el dist/ de calc-core para resolver file:../calc-core.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            calc-core/package-lock.json
            frontend/package-lock.json
      - name: Build calc-core (dependencia local)
        working-directory: calc-core
        run: |
          npm ci
          npm run build
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build
